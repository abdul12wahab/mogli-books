<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موگلي — کتابونه</title>
<meta name="description" content="د موگلي کتابونه. د روزي، باور او د غرونو او پردیسۍ د ژوند کیسې، وړیا د لوستلو لپاره.">
<style>
  :root {
    --bg: #faf7f2;
    --ink: #1a1a1a;
    --muted: #6b6456;
    --accent: #a9532f;
    --card: #ffffff;
    --border: #e8e0d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'BookFont', 'Noto Naskh Arabic', serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.8;
  }
  @font-face {
    font-family: 'BookFont';
    src: url('fonts/NotoNaskhArabic-Regular.ttf') format('truetype');
    font-weight: normal;
  }
  @font-face {
    font-family: 'BookFont';
    src: url('fonts/NotoNaskhArabic-Bold.ttf') format('truetype');
    font-weight: bold;
  }
  header {
    text-align: center;
    padding: 4.5rem 1.5rem 3rem;
  }
  header h1 {
    font-size: 2.6rem;
    margin: 0 0 0.6rem;
  }
  header p {
    color: var(--muted);
    font-size: 1.15rem;
    max-width: 560px;
    margin: 0 auto;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 2rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
  }
  .card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
  }
  .card-body {
    padding: 1.3rem 1.4rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    flex: 1;
    text-align: right;
  }
  .card-body .lang {
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card-body h2 {
    margin: 0;
    font-size: 1.4rem;
  }
  .card-body .subtitle {
    margin: 0;
    font-size: 1rem;
    color: var(--muted);
  }
  .card-body .desc {
    font-size: 1.02rem;
    color: var(--ink);
    margin: 0.2rem 0 0.6rem;
  }
  .actions {
    margin-top: auto;
    display: flex;
    gap: 0.6rem;
  }
  .btn {
    flex: 1;
    text-align: center;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  footer {
    text-align: center;
    padding: 2rem 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<header>
  <h1>موگلي</h1>
  <p>د روزي، باور، او د غرونو او پردیسۍ د ژوند کیسې. ټول کتابونه وړیا دي.</p>
</header>
<main>
  <div class="grid">
    <div class="card">
      <img src="img/rizq-cover.jpg" alt="پوښ: د روزي لار">
      <div class="card-body">
        <span class="lang">پښتو</span>
        <h2>د روزي لار</h2>
        <p class="subtitle">یو کیسه د کونړ غرونو نه</p>
        <p class="desc">د یار محمد کیسه — یو شپون هلک چې د خپل بخت لپاره کلی پریږدي، او په لاره کې زده کوي چې روزي په ریښتیا کې څه شی دی.</p>
        <div class="actions">
          <a class="btn btn-primary" href="lesen/der-weg-des-rizq.html">آنلاین لوستل</a>
          <a class="btn btn-secondary" href="books/der-weg-des-rizq.pdf">PDF ډاونلوډ</a>
        </div>
      </div>
    </div>
  </div>
</main>
<footer>
  © <span id="year"></span> موگلي — ټول کتابونه وړیا دي.
</footer>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
